[project]
name = "synth"
version = "0.1.0"
description = "Personal assistant on macOS — calendar, reminders, mail drafts, personal context DB"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-EventKit>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth"]
